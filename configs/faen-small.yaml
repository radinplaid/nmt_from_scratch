model:
  d_model: 384
  ffn_dim: 1536
  enc_layers: 8
  dec_layers: 2
  n_heads: 8
  max_len: 512
  vocab_size: 20000
  mlp_type: "gated"
  activation: "gelu"

data:
  src_lang: "fa"
  tgt_lang: "en"
  src_train_path: "data/train.fa"
  tgt_train_path: "data/train.en"
  src_dev_path: "data/dev.fa"
  tgt_dev_path: "data/dev.en"
  max_tokens_per_batch: 10000
  buffer_size: 150000
  num_workers: 4

train:
  experiment_name: "faen-small"
  aim_repo: "~/mt/.aim"
  lr: 2.5e-3
  accum_steps: 12
  warmup_steps: 5000
  max_steps: 200000
  eval_steps: 2000
  max_checkpoints: 10
  precision: "bf16"

export:
  k: 5
  export_int8: false
  quantization: "int8"