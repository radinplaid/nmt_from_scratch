model:
  d_model: 512
  enc_layers: 8
  dec_layers: 2
  n_heads: 16
  # n_kv_heads: number of key/value heads.
  #   0 (default) → standard MHA (n_kv_heads == n_heads)
  #   1           → Multi-Query Attention (MQA, maximum speedup, smallest KV cache)
  #   2           → GQA with 4 groups  ← recommended starting point
  #   4           → GQA with 2 groups
  #   n_heads (8) → standard MHA
  # n_heads must be divisible by n_kv_heads.
  n_kv_heads: 4
  ffn_dim: 2048
  max_len: 256
  vocab_size: 10000
  mlp_type: "gated"
  # silu, gelu
  activation: "gelu"
  use_checkpoint: true
  # tie_embeddings: share weights between the target token embedding and
  # the output projection (generator).  Reduces parameter count by
  # vocab_size × d_model and improves translation quality.
  tie_embeddings: true

data:
  src_lang: "fa"
  tgt_lang: "en"
  src_train_path: "data/train.fa"
  tgt_train_path: "data/train.en"
  src_dev_path: "data/dev.fa"
  tgt_dev_path: "data/dev.en"
  max_tokens_per_batch: 10000
  buffer_size: 150000
  num_workers: 2
  prefetch_factor: 32

train:
  experiment_name: "faen-small"
  aim_repo: "~/mt/.aim"
  lr: 1.0e-3
  accum_steps: 12
  warmup_steps: 5000
  max_steps: 100000
  eval_steps: 2500
  max_checkpoints: 4
  precision: "bf16"

export:
  k: 4
  export_int8: false
  quantization: "int8"
