model:
  d_model: 256
  enc_layers: 6
  dec_layers: 2
  n_heads: 8
  ffn_dim: 1024
  max_len: 256
  vocab_size: 10000
  mlp_type: "gated"
  activation: "gelu"

data:
  src_lang: "fa"
  tgt_lang: "en"
  src_train_path: "data/train.fa"
  tgt_train_path: "data/train.en"
  src_dev_path: "data/dev.fa"
  tgt_dev_path: "data/dev.en"
  max_tokens_per_batch: 20000
  buffer_size: 150000
  num_workers: 4

train:
  experiment_name: "faen-small"
  aim_repo: "~/mt/.aim"
  lr: 2.5e-3
  accum_steps: 6
  warmup_steps: 5000
  max_steps: 20000
  eval_steps: 1000
  max_checkpoints: 4
  precision: "bf16"

export:
  k: 4
  export_int8: false
  quantization: "int8"